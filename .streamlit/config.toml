# Витрина показывается руководителю: трейсбек в браузере не нужен и раскрывает
# пути и куски кода (CLAUDE.md, 0b, пункт 4б). "none" — в браузере только общее
# сообщение, подробности — в терминал. Не false: в streamlit 1.63 false устарело
# и означает "stacktrace", то есть трейсбек остаётся на экране.
[client]
showErrorDetails = "none"
